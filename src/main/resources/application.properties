# ============================================
# CITYPULSE APPLICATION CONFIGURATION
# ============================================

spring.application.name=citypulse


# ============================================
# DATABASE CONFIGURATION (MySQL)
# ============================================

spring.datasource.url=jdbc:mysql://localhost:3306/citypulse_traffic_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Kamalesh@123


# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# ============================================
# SERVER CONFIGURATION
# ============================================

server.port=8080


# ============================================
# CITYPULSE ROUTING CONFIGURATION
# ============================================

citypulse.routing.provider=local
citypulse.routing.base-url=http://localhost:8081
citypulse.routing.graphhopper-url=http://localhost:8989


# ============================================
# CITYPULSE LOCAL GEOCODING CONFIGURATION
# ============================================

citypulse.geocoding.photon-url=http://localhost:2322


# ============================================
# STATIC RESOURCE CACHE CONTROL (DEV MODE)
# ============================================
# Disables browser and server-side caching for
# static files (JS, CSS, HTML) during development.
# This ensures that updating app.js or translations.js
# is reflected immediately in the browser without
# needing to clear browser cache manually.
# ============================================

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.chain.enabled=true
spring.web.resources.chain.strategy.content.enabled=false
spring.web.resources.chain.strategy.fixed.enabled=false


# ============================================
# TEMPLATE CACHE (if Thymeleaf / templates used)
# ============================================

spring.thymeleaf.cache=false


# ============================================
# SPRING DEVTOOLS LIVE RELOAD
# ============================================

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


# ============================================
# SPRING MVC / WEB CONFIGURATION
# ============================================
# Disable ETag caching for static resources
# so that every request gets a fresh file.
# ============================================

spring.mvc.etag.enabled=false


# ============================================
# LOGGING (optional — helps debug cache issues)
# ============================================

logging.level.org.springframework.web.servlet.resource=INFO
logging.level.org.springframework.web.servlet.handler=INFO